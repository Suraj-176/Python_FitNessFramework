[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers

# Markers
markers =
    integration: Integration tests (may be slow)
    unit: Unit tests (fast)
    slow: Slow tests

[coverage:run]
# Coverage source
source = fixtures,core

# Files to include
include = 
    fixtures/*.py
    core/*.py

# Files to exclude
omit = 
    */tests/*
    */waferslim/*
    */__pycache__/*
    */venv/*
    */.venv/*
